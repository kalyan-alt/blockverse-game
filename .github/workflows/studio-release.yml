name: Build Blockverse apps
on:
  push:
    tags: ['studio-v*', 'v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: win
          - os: macos-latest
            plat: mac
          - os: ubuntu-latest
            plat: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Build Blockverse Studio
        run: npm run dist:${{ matrix.plat }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Build Blockverse Avatar Creator
        run: npm run dista:${{ matrix.plat }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.plat }}
          if-no-files-found: ignore
          path: |
            dist/Blockverse-Studio-Setup.exe
            dist/Blockverse-Studio.dmg
            dist/Blockverse-Studio.AppImage
            dist-avatar/Blockverse-Avatar-Creator-Setup.exe
            dist-avatar/Blockverse-Avatar-Creator.dmg
            dist-avatar/Blockverse-Avatar-Creator.AppImage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            dist/Blockverse-Studio-Setup.exe
            dist/Blockverse-Studio.dmg
            dist/Blockverse-Studio.AppImage
            dist-avatar/Blockverse-Avatar-Creator-Setup.exe
            dist-avatar/Blockverse-Avatar-Creator.dmg
            dist-avatar/Blockverse-Avatar-Creator.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Prepare web apps
        run: |
          npm install
          npm run prepare-app
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Studio APK
        run: |
          npx cap init "Blockverse Studio" com.blockverse.studio --web-dir app
          npx cap add android
          npx cap sync android
          (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk Blockverse-Studio.apk
      - name: Avatar Creator APK
        run: |
          rm -rf android capacitor.config.json capacitor.config.ts
          npx cap init "Blockverse Avatar Creator" com.blockverse.avatarcreator --web-dir app-avatar
          npx cap add android
          npx cap sync android
          (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk Blockverse-Avatar-Creator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            Blockverse-Studio.apk
            Blockverse-Avatar-Creator.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Blockverse-Studio.apk
            Blockverse-Avatar-Creator.apk
